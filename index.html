<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>RecipeBook — Cuisinez le Monde</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0a0a;color:#e5e5e5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
input,select{font-family:inherit}
a{color:inherit;text-decoration:none}
:root{--acc:#f5c842;--bg:#0a0a0a;--card:#161616;--bdr:#242424;--mut:rgba(255,255,255,.38);--navh:60px;--safe:env(safe-area-inset-bottom,0px)}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── HEADER ── */
#hdr{position:fixed;inset:0 0 auto;z-index:90;height:var(--navh);background:rgba(10,10,10,.9);border-bottom:1px solid rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;align-items:center;padding:0 18px;gap:10px}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
#lgem{width:30px;height:30px;border-radius:8px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;font-size:14px;color:#000;transition:background .35s}
.lname{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:#fff}
#dnav{display:flex;align-items:center;gap:1px;flex:1;overflow:hidden}
.np{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:9px;font-size:12px;font-weight:500;color:var(--mut);transition:all .2s;white-space:nowrap;flex-shrink:0}
.np:hover{color:#fff;background:rgba(255,255,255,.06)}
.np.on{color:#000;background:var(--acc)}
.fb{background:rgba(0,0,0,.2);color:inherit;font-size:10px;font-weight:700;padding:1px 4px;border-radius:99px;display:none}
.fb.v{display:inline}
.hright{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
#dsw{position:relative}
#dsw input{width:140px;padding:7px 10px 7px 28px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:12px;outline:none;caret-color:var(--acc);transition:width .3s,border-color .2s}
#dsw input::placeholder{color:var(--mut)}
#dsw input:focus{width:180px;border-color:rgba(255,255,255,.18)}
.si{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:12px;height:12px;opacity:.35;pointer-events:none;color:#fff}

/* ── LANGUAGE SWITCHER ── */
#lang-sw{display:flex;align-items:center;background:rgba(255,255,255,.06);border-radius:10px;border:1px solid rgba(255,255,255,.1);overflow:hidden;flex-shrink:0;height:32px}
.lb{padding:0 10px;font-size:12px;font-weight:600;color:var(--mut);height:100%;display:flex;align-items:center;gap:4px;transition:all .2s}
.lb:hover{color:#fff}
.lb.on{background:var(--acc);color:#000}
.lsep{width:1px;background:rgba(255,255,255,.1);height:18px}
#ham{display:none;width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.07);align-items:center;justify-content:center;color:#fff;flex-shrink:0}

/* ── MOBILE DROPDOWN ── */
#mdd{display:none;position:fixed;top:var(--navh);inset-inline:0;z-index:89;background:rgba(8,8,8,.97);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:10px 14px 14px;flex-direction:column;gap:3px;animation:fadeUp .2s ease}
#mdd.open{display:flex}
.mlangrow{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 12px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:4px}
.mlangrow span{font-size:12px;color:var(--mut);font-weight:500}
#mlang-sw{display:flex;background:rgba(255,255,255,.06);border-radius:9px;border:1px solid rgba(255,255,255,.1);overflow:hidden;height:32px}
.mlb{padding:0 12px;font-size:13px;font-weight:600;color:var(--mut);height:100%;display:flex;align-items:center;gap:4px;transition:all .2s}
.mlb.on{background:var(--acc);color:#000}
.mlb:hover:not(.on){color:#fff}
.mlsep{width:1px;background:rgba(255,255,255,.1);height:18px}
.msr{position:relative;margin-bottom:5px}
.msr input{width:100%;padding:10px 12px 10px 36px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-size:14px;outline:none;caret-color:var(--acc)}
.msr input::placeholder{color:var(--mut)}
.mnb{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:11px;font-size:14px;font-weight:500;color:rgba(255,255,255,.6);transition:all .15s;width:100%;text-align:left}
.mnb:hover{background:rgba(255,255,255,.06);color:#fff}
.mnb.on{background:var(--acc);color:#000}

/* ── BOTTOM NAV ── */
#bnav{display:none;position:fixed;bottom:0;inset-inline:0;z-index:90;background:rgba(10,10,10,.96);border-top:1px solid rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.bni{display:flex;height:54px}
.bnt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:rgba(255,255,255,.32);font-size:9px;font-weight:500;position:relative;padding:4px 2px}
.bnt .bi{font-size:17px;line-height:1}
.bnt.on{color:var(--acc)}
.bnt.on::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--acc);border-radius:0 0 3px 3px}
.bntb{position:absolute;top:4px;right:calc(50% - 18px);background:var(--acc);color:#000;font-size:8px;font-weight:700;padding:1px 4px;border-radius:99px;display:none}
.bntb.v{display:block}

/* ── MAIN ── */
#wrap{padding-top:calc(var(--navh)+24px);padding-bottom:56px;max-width:1280px;margin:0 auto;padding-left:14px;padding-right:14px}
.page{display:none;animation:fadeUp .28s ease}
.page.on{display:block}
.slabel{font-size:10px;font-weight:600;letter-spacing:.35em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.phead{margin-bottom:20px}
.phead h1{font-family:'Playfair Display',serif;font-size:clamp(24px,5vw,38px);font-weight:700;color:#fff;line-height:1.1}
.psub{font-size:13px;color:var(--mut);margin-top:4px}
.psub b{color:var(--acc);font-weight:500}

/* ── GRID ── */
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:480px){.bento{grid-template-columns:repeat(3,1fr);gap:12px}}
@media(min-width:700px){.bento{grid-template-columns:repeat(4,1fr);gap:14px}}
@media(min-width:1024px){.bento{grid-template-columns:repeat(5,1fr);gap:15px}}

/* ── CARD ── */
.card{border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--bdr);cursor:pointer;position:relative;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(0,0,0,.55)}
.card:active{transform:scale(.97)}
.cimg{overflow:hidden;aspect-ratio:4/3}
.cimg img{width:100%;height:100%;object-fit:cover;transition:transform .45s}
.card:hover .cimg img{transform:scale(1.07)}
.cbody{padding:8px 10px 11px}
.ctitle{font-family:'Playfair Display',serif;font-size:13px;font-weight:600;color:#fff;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── SKELETON ── */
.skc{border-radius:14px;overflow:hidden;border:1px solid var(--bdr);background:var(--card)}
.ski{aspect-ratio:4/3;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.skb{padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.skl{height:11px;border-radius:5px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.skl.w3{width:70%}

/* ── HEART ── */
.hbtn{position:absolute;top:7px;right:7px;z-index:5;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;transition:transform .18s}
.hbtn:hover{transform:scale(1.18)}
.hbtn:active{transform:scale(.88)}
.hbtn svg{width:13px;height:13px;transition:fill .18s,stroke .18s}

/* ── HERO ── */
.feat{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;margin-bottom:8px}
.feat img{width:100%;height:260px;object-fit:cover;display:block;transition:transform .55s}
.feat:hover img{transform:scale(1.04)}
.feat:active img{transform:scale(1.01)}
.fov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.15) 55%,transparent 100%)}
.fbody{position:absolute;bottom:0;left:0;right:0;padding:20px 18px}
.ftag{display:inline-flex;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:600;color:#000;background:var(--acc);margin-bottom:7px}
.ftitle{font-family:'Playfair Display',serif;font-size:clamp(18px,4vw,26px);font-weight:700;color:#fff;line-height:1.15;max-width:520px}
.farea{font-size:11px;color:rgba(255,255,255,.45);margin-top:4px}
.feat .hbtn{top:12px;right:12px;width:32px;height:32px}
.feat .hbtn svg{width:15px;height:15px}
.feat-sk{border-radius:18px;height:260px;margin-bottom:8px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}

/* ── WORLD ── */
.whead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:20px}
.selw{position:relative}
.asel{-webkit-appearance:none;appearance:none;padding:9px 32px 9px 12px;border-radius:11px;border:1px solid var(--bdr);background:var(--card);color:#e5e5e5;font-size:13px;font-weight:500;cursor:pointer;outline:none}
.asel:hover{border-color:rgba(255,255,255,.2)}
.selw svg{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--mut);pointer-events:none}

/* ── EMPTY ── */
.empty{text-align:center;padding:64px 20px;color:var(--mut)}
.eico{font-size:46px;display:block;margin-bottom:14px}
.empty p{font-size:14px;line-height:1.7}

/* ── SEARCH INPUT ── */
.sfull{position:relative;margin-bottom:20px}
.sfull input{width:100%;padding:13px 14px 13px 42px;border-radius:14px;border:1px solid var(--bdr);background:rgba(255,255,255,.04);color:#fff;font-size:14px;outline:none;caret-color:var(--acc);transition:border-color .2s}
.sfull input:focus{border-color:rgba(255,255,255,.18)}
.sfull input::placeholder{color:var(--mut)}
.sfull .si{left:13px;width:16px;height:16px}

/* ── MODAL ── */
#mbk{display:none;position:fixed;inset:0;z-index:200;align-items:flex-end;justify-content:center}
#mbk.open{display:flex}
@media(min-width:600px){#mbk{align-items:center;padding:18px}}
.mov{position:absolute;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mbox{position:relative;width:100%;max-width:660px;max-height:92vh;overflow-y:auto;background:#111;border-radius:20px 20px 0 0;border:1px solid rgba(255,255,255,.09);z-index:1;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:slideUp .25s ease}
@media(min-width:600px){.mbox{border-radius:20px;animation:pop .25s ease}}
.miw{position:relative}
.miw img{width:100%;height:220px;object-fit:cover;border-radius:20px 20px 0 0;display:block}
@media(min-width:600px){.miw img{height:240px}}
.mgrd{position:absolute;bottom:0;left:0;right:0;height:100px;background:linear-gradient(to top,#111,transparent);pointer-events:none}
.mcls{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:5;transition:background .2s}
.mcls:hover{background:rgba(255,255,255,.15)}
.miw .hbtn{top:10px;right:44px}
.mcont{padding:0 16px 26px}
.mttl{font-family:'Playfair Display',serif;font-size:clamp(18px,5vw,25px);font-weight:700;color:#fff;line-height:1.2;margin-bottom:9px}
.mchips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.mchip{padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.07);font-size:11px;color:rgba(255,255,255,.5)}
.msec{font-size:10px;font-weight:600;letter-spacing:.35em;text-transform:uppercase;color:var(--mut);margin:14px 0 8px}
.igrd{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:380px){.igrd{grid-template-columns:1fr}}
.ii{display:flex;align-items:center;gap:6px;font-size:12.5px;color:rgba(255,255,255,.75)}
.idot{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:var(--acc)}
.imea{color:var(--mut);font-size:11.5px;margin-right:2px}
.instr{font-size:12.5px;line-height:1.75;color:rgba(255,255,255,.6);white-space:pre-line}
.ytb{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:8px 14px;border-radius:10px;background:rgba(255,50,50,.1);color:#ff5555;font-size:13px;font-weight:500;transition:background .2s}
.ytb:hover{background:rgba(255,50,50,.18)}
.mskw{padding:18px;display:flex;flex-direction:column;gap:10px}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:9px}

/* ── TRANSLATION BADGE ── */
.tpill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:500;margin-bottom:10px}
.tpill.tload{color:#f5c842;background:rgba(245,200,66,.08);border:1px solid rgba(245,200,66,.2)}
.tpill.tdone{color:#4ade80;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.2)}
.tpill.terr{color:rgba(255,180,100,.8);background:rgba(255,150,50,.06);border:1px solid rgba(255,150,50,.15)}
.tspin{width:10px;height:10px;border:1.5px solid rgba(245,200,66,.25);border-top-color:#f5c842;border-radius:50%;animation:spin .75s linear infinite;flex-shrink:0}

/* ── RESPONSIVE ── */
@media(max-width:800px){#dnav{display:none}#dsw{display:none}#ham{display:flex}#bnav{display:block}#wrap{padding-bottom:calc(54px + var(--safe) + 24px)}}
@media(min-width:801px){#ham{display:none}#mdd{display:none!important}}
@media(min-width:700px){.feat img{height:340px}.feat-sk{height:340px}}
@media(hover:none){.card:hover{transform:none;box-shadow:none}.card:hover .cimg img{transform:none}.card:active{transform:scale(.97)}}
@media(max-width:800px) and (orientation:landscape){.feat img,.feat-sk{height:200px}:root{--navh:52px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- HEADER -->
<header id="hdr">
  <div class="logo">
    <div id="lgem">R</div>
    <span class="lname">RecipeBook</span>
  </div>
  <nav id="dnav">
    <button class="np on" data-t="home"   onclick="go('home')">  🏠 <span data-ui="nav_home">Accueil</span></button>
    <button class="np"    data-t="pastry" onclick="go('pastry')">🍰 <span data-ui="nav_pastry">Pâtisseries</span></button>
    <button class="np"    data-t="meat"   onclick="go('meat')">  🥩 <span data-ui="nav_meat">Plats Résistants</span></button>
    <button class="np"    data-t="veggie" onclick="go('veggie')">🥗 <span data-ui="nav_veggie">Healthy &amp; Veggie</span></button>
    <button class="np"    data-t="world"  onclick="go('world')"> 🌍 <span data-ui="nav_world">Cuisine du Monde</span></button>
    <button class="np"    data-t="fav"    onclick="go('fav')">   ❤️ <span data-ui="nav_fav">Favoris</span> <span class="fb" id="db">0</span></button>
  </nav>
  <div class="hright">
    <div id="dsw">
      <svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="search" id="ds" placeholder="Rechercher…" oninput="onSrch(this.value)" onfocus="go('search')" autocomplete="off"/>
    </div>
    <div id="lang-sw">
      <button class="lb on" id="lbfr" onclick="setLang('fr')">🇫🇷 FR</button>
      <div class="lsep"></div>
      <button class="lb" id="lben" onclick="setLang('en')">🇬🇧 EN</button>
    </div>
    <button id="ham" onclick="togM()" aria-label="Menu">
      <svg id="hico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>
</header>

<!-- MOBILE MENU -->
<div id="mdd">
  <div class="mlangrow">
    <span>Langue / Language</span>
    <div id="mlang-sw">
      <button class="mlb on" id="mlbfr" onclick="setLang('fr');cM()">🇫🇷 FR</button>
      <div class="mlsep"></div>
      <button class="mlb" id="mlben" onclick="setLang('en');cM()">🇬🇧 EN</button>
    </div>
  </div>
  <div class="msr">
    <svg class="si" style="left:11px;width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="search" id="ms" placeholder="Rechercher…" oninput="onSrch(this.value)" onfocus="go('search');cM()" autocomplete="off"/>
  </div>
  <button class="mnb on" data-mt="home"   onclick="go('home');  cM()">🏠 <span data-ui="nav_home">Accueil</span></button>
  <button class="mnb"   data-mt="pastry" onclick="go('pastry');cM()">🍰 <span data-ui="nav_pastry">Pâtisseries</span></button>
  <button class="mnb"   data-mt="meat"   onclick="go('meat');  cM()">🥩 <span data-ui="nav_meat">Plats Résistants</span></button>
  <button class="mnb"   data-mt="veggie" onclick="go('veggie');cM()">🥗 <span data-ui="nav_veggie">Healthy &amp; Veggie</span></button>
  <button class="mnb"   data-mt="world"  onclick="go('world'); cM()">🌍 <span data-ui="nav_world">Cuisine du Monde</span></button>
  <button class="mnb"   data-mt="fav"    onclick="go('fav');   cM()">❤️ <span data-ui="nav_fav">Favoris</span></button>
  <button class="mnb"   data-mt="search" onclick="go('search');cM()">🔍 <span data-ui="nav_search">Recherche</span></button>
</div>

<!-- PAGES -->
<div id="wrap">
  <section class="page on" id="page-home">
    <div class="slabel" id="lbl-feat">✨ Recette à la une</div>
    <div id="fw"></div>
    <div id="hr"></div>
  </section>
  <section class="page" id="page-pastry">
    <div class="phead"><h1>🍰 <span data-ui="nav_pastry">Pâtisseries</span></h1><p class="psub" id="pcount"></p></div>
    <div id="pg" class="bento"></div>
  </section>
  <section class="page" id="page-meat">
    <div class="phead"><h1>🥩 <span data-ui="nav_meat">Plats Résistants</span></h1><p class="psub" id="mcount"></p></div>
    <div id="mg" class="bento"></div>
  </section>
  <section class="page" id="page-veggie">
    <div class="phead"><h1>🥗 <span data-ui="nav_veggie">Healthy &amp; Veggie</span></h1><p class="psub" id="vcount"></p></div>
    <div id="vg" class="bento"></div>
  </section>
  <section class="page" id="page-world">
    <div class="whead">

/* ══════════════════════════════════════════════════════

let cur='home', loaded={}, favs=[], favM={}, sT=null, lang='fr';

/* ══════════════════════════════════════════════════════

function go(tab) {
  cur=tab; cM();
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  const pg=document.getElementById('page-'+tab); if(pg) pg.classList.add('on');

function togM() {

  document.getElementById('hico').innerHTML='<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>';

/* ══════════════════════════════════════════════════════
   TRANSLATION ENGINE
   Uses MyMemory (free, CORS *, no key, 5000 chars/day).
   Translates one string at a time — simple and reliable.
   Results cached in TC{} so each recipe is only translated once.
══════════════════════════════════════════════════════ */
async function translateOne(text) {
  if(!text || !text.trim()) return text;
  const url = 'https://api.mymemory.translated.net/get'
    + '?q=' + encodeURIComponent(text.slice(0,500))
    + '&langpair=en|fr'
    + '&de=recipebook@example.com'; // optional email = higher quota
  try {
    const r = await fetch(url, { mode:'cors' });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    if(d.responseStatus===200 && d.responseData?.translatedText) {
      return d.responseData.translatedText;
    }
  } catch(e) {}
  return text; // fallback: original
}

async function translateMeal(meal) {
  if(lang==='en') return null;
  if(TC[meal.idMeal]) return TC[meal.idMeal];

  const ings = Array.from({length:20},(_,i)=>({
    ing:meal[`strIngredient${i+1}`], mea:meal[`strMeasure${i+1}`]
  })).filter(x=>x.ing?.trim());

  // Translate name and all ingredient names in parallel
  const instrSlice = (meal.strInstructions||'').slice(0,800);

  const [tName, tInstr, ...tIngNames] = await Promise.all([
    translateOne(meal.strMeal),
    translateOne(instrSlice),
    ...ings.map(x => translateOne(x.ing))
  ]);

  const result = {
    name: tName,
    instructions: tInstr,
    ingredients: ings.map((x,i) => ({ ing: tIngNames[i]||x.ing, mea: x.mea }))
  };

  TC[meal.idMeal] = result;
  return result;
}

/* ══════════════════════════════════════════════════════
   MEAL DB API
══════════════════════════════════════════════════════ */
const MDB='https://www.themealdb.com/api/json/v1/1';
async function apiFetch(path) {
  try {
    const r=await fetch(MDB+path,{mode:'cors'});
    if(r.ok){const d=await r.json();if(d&&d.meals!==undefined)return d;}
  } catch(e){}
  try {
    const r2=await fetch('https://corsproxy.io/?'+encodeURIComponent(MDB+path));
    if(r2.ok){
      const d2=await r2.json();
      if(d2&&d2.contents) return JSON.parse(d2.contents);
      if(d2&&d2.meals!==undefined) return d2;
    }
  } catch(e){}
  return {meals:null};
}
const gCat  = c  => apiFetch(`/filter.php?c=${c}`).then(d=>d.meals||[]);
const gArea = a  => apiFetch(`/filter.php?a=${a}`).then(d=>d.meals||[]);
const gMeal = id => apiFetch(`/lookup.php?i=${id}`).then(d=>(d.meals||[])[0]||null);
const gRnd  = ()  => apiFetch(`/random.php`).then(d=>(d.meals||[])[0]||null);
const gSrch = q  => apiFetch(`/search.php?s=${encodeURIComponent(q)}`).then(d=>d.meals||[]);

/* ══════════════════════════════════════════════════════
   SKELETONS / UTILS
══════════════════════════════════════════════════════ */
function sks(n){return Array(n).fill('<div class="skc"><div class="ski"></div><div class="skb"><div class="skl"></div><div class="skl w3"></div></div></div>').join('');}
function saveFavs(){try{localStorage.setItem('rb6',JSON.stringify(favs));}catch(e){}}
function isFav(id){return favs.includes(String(id));}
function hsvg(id){
  const a=TH[cur]?.acc||'#f5c842',ac=isFav(id);
  return`<svg viewBox="0 0 24 24" fill="${ac?a:'none'}" stroke="${ac?a:'rgba(255,255,255,.65)'}" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
}
function hbtn(id){return`<button class="hbtn" onclick="tFav(event,'${id}')" data-hid="${id}" aria-label="Favori">${hsvg(id)}</button>`;}
function tFav(e,id){
  e.stopPropagation();
  const sid=String(id);
  favs=isFav(sid)?favs.filter(x=>x!==sid):[...favs,sid];
  saveFavs(); updB();
  const a=TH[cur]?.acc||'#f5c842',ac=isFav(sid);
  document.querySelectorAll(`[data-hid="${sid}"]`).forEach(b=>{
    const s=b.querySelector('svg');
    s.setAttribute('fill',ac?a:'none');
    s.setAttribute('stroke',ac?a:'rgba(255,255,255,.65)');
  });
}
function updB(){
  const n=favs.length,sh=n>0;
  ['db','mb2'].forEach(id=>{const el=document.getElementById(id);if(!el)return;el.textContent=n;el.classList.toggle('v',sh);});
}
function card(m){
  const n=m.strMeal.replace(/"/g,'&quot;');
  return`<div class="card" onclick="openM('${m.idMeal}')"><div class="cimg"><img src="${m.strMealThumb}/preview" alt="${n}" loading="lazy" onerror="this.src='${m.strMealThumb}'"/></div>${hbtn(m.idMeal)}<div class="cbody"><div class="ctitle">${m.strMeal}</div></div></div>`;
}

/* ══════════════════════════════════════════════════════
   PAGE LOADERS
══════════════════════════════════════════════════════ */
async function loadHome() {
  document.getElementById('fw').innerHTML='<div class="feat-sk"></div>';
  document.getElementById('hr').innerHTML=`
    <div class="slabel" id="hlbl-d">${u('lbl_d')}</div><div class="bento" id="hd">${sks(4)}</div>
    <div class="slabel" style="margin-top:22px" id="hlbl-m">${u('lbl_m')}</div><div class="bento" id="hm">${sks(4)}</div>
    <div class="slabel" style="margin-top:22px" id="hlbl-v">${u('lbl_v')}</div><div class="bento" id="hv">${sks(4)}</div>`;
  const[feat,des,bef,veg]=await Promise.all([gRnd(),gCat('Dessert'),gCat('Beef'),gCat('Vegetarian')]);
  if(feat){
    const n=feat.strMeal.replace(/"/g,'&quot;');
    document.getElementById('fw').innerHTML=`<div class="feat" onclick="openM('${feat.idMeal}')"><img src="${feat.strMealThumb}" alt="${n}" onerror="this.style.opacity='.4'"/><div class="fov"></div><div class="fbody"><div class="ftag">${feat.strCategory||'Recette'}</div><div class="ftitle">${feat.strMeal}</div>${feat.strArea?`<div class="farea">${feat.strArea}</div>`:''}</div>${hbtn(feat.idMeal)}</div>`;
  } else {
    document.getElementById('fw').innerHTML='<p style="color:var(--mut);font-size:13px;margin-bottom:16px">⚠️ Impossible de charger la recette vedette. Vérifiez votre connexion.</p>';
  }
  const sh=a=>a.sort(()=>Math.random()-.5);
  document.getElementById('hd').innerHTML=sh(des).slice(0,4).map(card).join('')||'';
  document.getElementById('hm').innerHTML=sh(bef).slice(0,4).map(card).join('')||'';
  document.getElementById('hv').innerHTML=sh(veg).slice(0,4).map(card).join('')||'';
}

async function loadCat(cats,gid,sid) {
  document.getElementById(gid).innerHTML=sks(8);
  document.getElementById(sid).innerHTML=u('loading');
  const r=await Promise.all(cats.map(gCat));
  const all=[...new Map(r.flat().map(m=>[m.idMeal,m])).values()].sort(()=>Math.random()-.5);
  document.getElementById(sid).innerHTML=`<b>${all.length}</b> ${u('recipes')}`;
  document.getElementById(gid).innerHTML=all.length?all.map(card).join(''):'<p style="color:var(--mut);font-size:13px">Indisponible.</p>';
}

async function loadArea(area) {
  document.getElementById('wg').innerHTML=sks(8);
  document.getElementById('wcount').innerHTML=u('loading');
  const meals=await gArea(area);
  document.getElementById('wcount').innerHTML=`<b>${meals.length}</b> ${u('recipes')} · ${area}`;
  document.getElementById('wg').innerHTML=meals.length?meals.map(card).join(''):'<p style="color:var(--mut);font-size:13px">Indisponible.</p>';
}

async function renderFavs() {
  const n=favs.length;
  document.getElementById('fcount').innerHTML=`<b>${n}</b> ${u('saved')}`;
  if(!n){document.getElementById('fvw').innerHTML=`<div class="empty"><span class="eico">🤍</span><p>${u('no_fav')}</p></div>`;return;}
  document.getElementById('fvw').innerHTML=`<div class="bento">${sks(n)}</div>`;
  const meals=await Promise.all(favs.map(id=>favM[id]?Promise.resolve(favM[id]):gMeal(id)));
  const v=meals.filter(Boolean); v.forEach(m=>{favM[m.idMeal]=m;});
  document.getElementById('fvw').innerHTML=`<div class="bento">${v.map(card).join('')}</div>`;
}

function onSrch(val) {
  ['ds','ms','spi'].forEach(id=>{const el=document.getElementById(id);if(el&&el!==document.activeElement)el.value=val;});
  const sg=document.getElementById('sg'),se=document.getElementById('se');
  clearTimeout(sT);
  if(!val.trim()){sg.innerHTML='';se.style.display='none';return;}
  sg.innerHTML=sks(8);se.style.display='none';
  sT=setTimeout(async()=>{
    const meals=await gSrch(val.trim());
    if(!meals.length){sg.innerHTML='';document.getElementById('sem').textContent=`${u('no_result')} « ${val} »`;se.style.display='block';}
    else{se.style.display='none';sg.innerHTML=meals.map(card).join('');}
  },420);
}

/* ══════════════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════════════ */
let modalOpen = false;

async function openM(id) {
  const back=document.getElementById('mbk'),mi=document.getElementById('mi');
  back.classList.add('open'); document.body.style.overflow='hidden'; modalOpen=true;
  mi.innerHTML='<div class="mskw"><div class="sk" style="height:220px;border-radius:14px"></div><div class="sk" style="height:24px;width:60%"></div><div class="sk" style="height:12px"></div><div class="sk" style="height:12px;width:80%"></div><div class="sk" style="height:12px;width:65%"></div></div>';

  const m=await gMeal(id);
  if(!m){mi.innerHTML='<p style="padding:40px;color:var(--mut);text-align:center">Erreur de chargement.</p>';return;}
  if(isFav(id)) favM[id]=m;

  const ings=Array.from({length:20},(_,i)=>({ing:m[`strIngredient${i+1}`],mea:m[`strMeasure${i+1}`]})).filter(x=>x.ing?.trim());
  const acc=TH[cur]?.acc||'#f5c842';

  if(lang==='en') {
    // English: show original immediately, no translation needed
    buildModal(mi, m, ings, acc, null, null);
  } else {
    // French: show original with "translating..." badge, then update with translation
    buildModal(mi, m, ings, acc, null, 'load');
    const trad = await translateMeal(m);
    if(modalOpen) {
      buildModal(mi, m, ings, acc, trad, trad ? 'done' : 'err');
    }
  }
}

function buildModal(mi, m, ings, acc, trad, state) {
  const name  = trad?.name  || m.strMeal;
  const instr = trad?.instructions || m.strInstructions || '';
  const tIngs = trad?.ingredients || null;

  const ingHTML = ings.map((x,i)=>{
    const ing = tIngs?.[i]?.ing || x.ing;
    const mea = (x.mea||'').trim();
    return`<div class="ii"><span class="idot" style="background:${acc}"></span><span><span class="imea">${mea}</span>${ing}</span></div>`;
  }).join('');

  let pill='';
  if(state==='load') pill=`<div class="tpill tload"><span class="tspin"></span>${u('tload')}</div>`;
  else if(state==='done') pill=`<div class="tpill tdone">${u('tdone')}</div>`;
  else if(state==='err')  pill=`<div class="tpill terr">ℹ ${u('terr')}</div>`;

  mi.innerHTML=`
    <div class="miw">
      <img src="${m.strMealThumb}" alt="${name.replace(/"/g,'&quot;')}" onerror="this.style.opacity='.4'"/>
      <div class="mgrd"></div>
      <button class="mcls" onclick="closeM()">✕</button>
      <button class="hbtn" onclick="tFav(event,'${m.idMeal}')" data-hid="${m.idMeal}" aria-label="Favori" style="top:10px;right:44px">${hsvg(m.idMeal)}</button>
    </div>
    <div class="mcont">
      ${pill}
      <h2 class="mttl">${name}</h2>
      <div class="mchips">
        ${m.strCategory?`<span class="mchip">${m.strCategory}</span>`:''}
        ${m.strArea?`<span class="mchip">${m.strArea}</span>`:''}
      </div>
      ${ings.length?`<div class="msec">${u('ing')}</div><div class="igrd">${ingHTML}</div>`:''}
      ${instr?`<div class="msec">${u('instr')}</div><div class="instr">${instr.slice(0,950)}${instr.length>950?'…':''}</div>`:''}
      ${m.strYoutube?`<a href="${m.strYoutube}" target="_blank" rel="noopener noreferrer" class="ytb">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M23 7s-.3-2-1.2-2.8C20.7 3 19.4 3 18.8 2.9 16.3 2.8 12 2.8 12 2.8s-4.3 0-6.8.1c-.6.1-1.9.1-3 1.3C1.3 5 1 7 1 7S.7 9.1.7 11.2v2c0 2.1.3 4.2.3 4.2s.3 2 1.2 2.8c1.1 1.2 2.6 1.1 3.3 1.2C7.3 21.6 12 21.6 12 21.6s4.3 0 6.8-.2c.6-.1 1.9-.1 3-1.3.9-.8 1.2-2.8 1.2-2.8s.3-2.1.3-4.2v-2C23.3 9.1 23 7 23 7zM9.7 15.5V8.4l8.1 3.6-8.1 3.5z"/></svg>
        ${u('watch')}
      </a>`:''}
    </div>`;
}
